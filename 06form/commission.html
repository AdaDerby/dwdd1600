<main>

    <h3>Commission Request Form</h3>
    <p>If you are interested in commissioning me, please fill out this form.</p>

    <form method="get" class="commission" action="thanks.html">

    <fieldset>
        <legend>Customer Info</legend>

        <label>First Name</label><input type="text" name="fname" required>
        <label>Last Name</label><input type="text" name="lname" required>
        <label>Email</label><input type="email" name="email" required>
        <label>Cell Number</label><input type="tel" name="phone" required placeholder="000-000-0000">
    </fieldset>

    <fieldset>
        <legend>Commission Type</legend>

        <label><input type="radio" name="type" value="logo">Brand Logo</label>
        <label><input type="radio" name="type" value="poster">Poster</label>
        <label><input type="radio" name="type" value="packaging">Packaging</label>
        <label><input type="radio" name="type" value="photography">Photography</label>

    </fieldset>

    <fieldset>
        <legend>Artwork Specifications</legend>

        <label><input type="checkbox" name="mockup" value="yes">Mockup</label>
        <label><input type="checkbox" name="printout" value="yes">Printout</label>
        <label><input type="checkbox" name="full presentation" value="yes">Full Presentation</label>
        
        <label>Timeframe<select name="timeframe">
            <option value="none">Please Select</option>
            <option value="two weeks">two weeks</option>
            <option value="one month">one month</option>
            <option value="two months">two months</option>
        </select></label>
    </fieldset>

        <label>Please give a summary of what you would like:<textarea name="summary" required></textarea></label>

        <input type="submit" value="Send Commission Request">

    </form>

</main>
